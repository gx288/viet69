name: "3. [Gộp Thủ Công] Tải Zpic & Đăng Xamvn Cùng Lúc"

on:
  # Đã tắt tự động chạy vì đã tách thành 2 Action riêng:
  # - Action 1: zpic-upload.yml (Chuyên tải & up Zpic tạo kho dự trữ)
  # - Action 2: xamvn-comment-video.yml (Chuyên đăng nhập & comment Xamvn theo tần suất tùy chỉnh)
  workflow_dispatch:
    inputs:
      max_posts_per_run:
        description: 'Số video cần tải & đăng ngay trong lần chạy này (mặc định: 1)'
        required: false
        type: string
        default: '1'
      limit_per_month:
        description: 'Số video tối đa mỗi tháng (mặc định: 20)'
        required: false
        type: string
        default: '20'

permissions:
  contents: write

jobs:
  post-daily-video:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install system dependencies
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::http::Timeout="10" update
            sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::http::Timeout="10" install -y ffmpeg curl fonts-dejavu-core
          else
            echo "ffmpeg and curl are already installed."
          fi

      - name: 📦 Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎬 Run Combined Downloader & Xamvn Poster
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          XAMVN_USERNAME: ${{ secrets.XAMVN_USERNAME || 'cudai2m' }}
          XAMVN_PASSWORD: ${{ secrets.XAMVN_PASSWORD || 'lehunghup' }}
          XAMVN_THREAD: "https://xamvn.yachts/threads/311300/"
        run: |
          MAX_POSTS="${{ github.event.inputs.max_posts_per_run || '1' }}"
          LIMIT_MONTH="${{ github.event.inputs.limit_per_month || '20' }}"
          echo "🚀 Khởi chạy gộp Tải Zpic & Đăng Xamvn (Tối đa $MAX_POSTS video/lần)..."
          python -u scripts/monthly_top_to_xamvn.py \
            --post \
            --thread "https://xamvn.yachts/threads/311300/" \
            --max-posts-per-run "$MAX_POSTS" \
            --limit-per-month "$LIMIT_MONTH" \
            --past-months 12

      - name: 💾 Commit & Push Progress
        if: always()
        run: |
          git config --local user.email "gx288@users.noreply.github.com"
          git config --local user.name "gx288"
          git pull --rebase origin main || true
          git add data/xamvn_posted_monthly.json data/monthly_videos.json data/zpic_uploaded.json data/zpic_bbcode.txt
          if git diff --staged --quiet; then
            echo "Không có video mới nào được đăng hôm nay."
          else
            git commit -m "Auto: daily top video $(date +'%Y-%m-%d %H:%M:%S') [skip ci]"
            git push origin main
          fi
