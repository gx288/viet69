name: Daily Video Scrape

on:
  schedule:
    - cron: '0 * * * *'      # Runs every hour (Hourly Incremental Scrape)
    - cron: '25 4 * * 0'     # Runs at 04:25 AM every Sunday (Weekly Full Scrape - Off-peak)
  workflow_dispatch:
    inputs:
      force_full:
        description: 'Force full scrape of all pages'
        required: false
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download credentials
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      run: |
        echo "$GOOGLE_CREDENTIALS" > credentials.json
        cat credentials.json  # Debug

    - name: Run script
      env:
        FORCE_FULL_SCRAPE: ${{ github.event.inputs.force_full || (github.event.schedule == '25 4 * * 0') }}
      run: |
        python -u find_and_test_proxies.py
        python -u scrape_videos.py

    - name: Commit and push data.txt
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data.txt config.json
        git commit -m "Daily update: data.txt $(date +%Y-%m-%d)" || echo "No changes"
        git pull --rebase
        git push

    - name: Upload temp CSV as artifact
      uses: actions/upload-artifact@v4
      with:
        name: temp-videos
        path: temp_videos.csv
