name: "1. Tải Video & Upload Zpic (Kho Dự Trữ)"

on:
  # Chạy 30 phút 1 lần từ 19:15 tối đến 01:15 sáng giờ Việt Nam (nếu kho đã đủ >= 10 link chờ đăng sẽ tự nghỉ ngay)
  schedule:
    - cron: '15,45 12-17 * * *'
    - cron: '15 18 * * *'
  workflow_dispatch:
    inputs:
      max_uploads_per_run:
        description: 'Mốc số link dự trữ cần duy trì trên Google Sheet (mặc định: 10)'
        required: false
        type: string
        default: '10'
      targets:
        description: 'Tuỳ chọn: Nhập trực tiếp Link cần tải (để trống sẽ tự lấy từ Google Sheet Ưu Tiên)'
        required: false
        type: string
        default: ''
      watermark:
        description: 'Chữ đóng dấu bản quyền (mặc định: xamvid.netlify.app)'
        required: false
        type: string
        default: 'xamvid.netlify.app'

permissions:
  contents: write

concurrency:
  group: zpic-upload-buffer
  cancel-in-progress: false

jobs:
  upload-to-zpic:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: ⚡ Install Static FFmpeg from GitHub CDN (2s - Không dùng apt-get)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "⚡ Đang tải FFmpeg static trực tiếp từ GitHub CDN..."
            curl -L --retry 3 -sS "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" -o /tmp/ffmpeg.tar.xz
            sudo tar -xJf /tmp/ffmpeg.tar.xz -C /usr/local/bin --strip-components=2 --wildcards "*/bin/ffmpeg" "*/bin/ffprobe"
            sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe
            rm -f /tmp/ffmpeg.tar.xz
          fi
          ffmpeg -version | head -n 1

      - name: 📦 Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎬 Tải Video & Upload lên Zpic (Dự Trữ Đủ 10 Link)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          MAX_UP="${{ github.event.inputs.max_uploads_per_run || '10' }}"
          WM="${{ github.event.inputs.watermark || 'xamvid.netlify.app' }}"
          TARGETS="${{ github.event.inputs.targets || '' }}"

          if [ -n "$TARGETS" ]; then
            echo "🚀 Chạy tải & upload Zpic theo link chỉ định: $TARGETS"
            python -u scripts/upload_to_zpic.py --targets "$TARGETS" --watermark "$WM"
          else
            echo "🚀 Kiểm tra & nạp kho dự trữ Zpic trên Google Sheet (Mục tiêu dự trữ: $MAX_UP link)..."
            python -u scripts/monthly_top_to_xamvn.py \
              --max-posts-per-run "$MAX_UP" \
              --watermark "$WM" \
              --limit-per-month 20 \
              --past-months 12
          fi

      - name: 💾 Commit & Push Kho Zpic
        if: always()
        run: |
          git config --local user.email "gx288@users.noreply.github.com"
          git config --local user.name "gx288"
          git add data/zpic_uploaded.json data/zpic_bbcode.txt
          if git diff --staged --quiet; then
            echo "Không có video Zpic mới nào được tải lên trong lần chạy này."
          else
            git commit -m "Zpic Upload Buffer: $(date +'%Y-%m-%d %H:%M:%S') [skip ci]"
            git checkout -- . || true
            for i in 1 2 3 4 5; do
              (git pull --rebase --autostash -X theirs origin main || { git rebase --abort 2>/dev/null || true; git checkout -- . || true; git pull --no-edit -X theirs origin main; }) && git push origin main && break
              echo "Push bị xung đột lần $i, đợi 3s thử lại..."
              sleep 3
            done
          fi
