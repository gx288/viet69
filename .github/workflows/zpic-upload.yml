name: "1. Tải Video & Upload Zpic (Kho Dự Trữ)"

on:
  # Chỉ chạy tự động 1 lần/ngày lúc 11:00 trưa giờ VN (04:00 UTC) để tải sẵn 3 video vào kho Zpic
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      max_uploads_per_run:
        description: 'Số video cần tải & up lên Zpic trong lần chạy này (mặc định: 3)'
        required: false
        type: string
        default: '3'
      targets:
        description: 'Tuỳ chọn: Nhập trực tiếp Link cần tải (để trống sẽ tự lấy từ Google Sheet Ưu Tiên)'
        required: false
        type: string
        default: ''
      watermark:
        description: 'Chữ đóng dấu bản quyền (mặc định: xamvid.netlify.app)'
        required: false
        type: string
        default: 'xamvid.netlify.app'

permissions:
  contents: write

jobs:
  upload-to-zpic:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install FFmpeg & system dependencies
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::http::Timeout="10" update
            sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::http::Timeout="10" install -y ffmpeg curl fonts-dejavu-core
          else
            echo "ffmpeg and curl are already installed."
          fi

      - name: 📦 Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎬 Tải Video & Upload lên Zpic (Không đăng Xamvn)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          MAX_UP="${{ github.event.inputs.max_uploads_per_run || '3' }}"
          WM="${{ github.event.inputs.watermark || 'xamvid.netlify.app' }}"
          TARGETS="${{ github.event.inputs.targets || '' }}"

          if [ -n "$TARGETS" ]; then
            echo "🚀 Chạy tải & upload Zpic theo link chỉ định: $TARGETS"
            python -u scripts/upload_to_zpic.py --targets "$TARGETS" --watermark "$WM"
          else
            echo "🚀 Chạy tải & upload Zpic từ Google Sheet Ưu Tiên (Tối đa $MAX_UP video/lần)..."
            python -u scripts/monthly_top_to_xamvn.py \
              --max-posts-per-run "$MAX_UP" \
              --watermark "$WM" \
              --limit-per-month 20 \
              --past-months 12
          fi

      - name: 💾 Commit & Push Kho Zpic
        if: always()
        run: |
          git config --local user.email "gx288@users.noreply.github.com"
          git config --local user.name "gx288"
          git pull --rebase origin main || true
          git add data/zpic_uploaded.json data/zpic_bbcode.txt
          if git diff --staged --quiet; then
            echo "Không có video Zpic mới nào được tải lên trong lần chạy này."
          else
            git commit -m "Zpic Upload Buffer: $(date +'%Y-%m-%d %H:%M:%S') [skip ci]"
            git push origin main
          fi
