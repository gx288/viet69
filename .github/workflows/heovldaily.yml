name: Daily Heovl Scrape

on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas gspread google-auth lxml html5lib fake-useragent

      - name: Write Google credentials
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          echo "$GOOGLE_CREDENTIALS" > heovl/credentials.json

      - name: Run scraper
        working-directory: heovl
        env:
          # Dùng fake-useragent + thêm header chống 403
          PYTHONUNBUFFERED: 1
        run: |
          python scrape_videos.py

      - name: Remove credentials before commit (tránh bị chặn push)
        run: |
          rm -f heovl/credentials.json
          echo "credentials.json đã được xóa an toàn"

      - name: Commit & Push data
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add heovl/data/ heovl/scraper.log
          git commit -m "Daily update: $(date +'%Y-%m-%d %H:%M:%S') (VN)" || echo "No changes"
          git push

      - name: Upload artifact (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heovl-result-${{ github.run_number }}
          path: |
            heovl/scraper.log
            heovl/data/
