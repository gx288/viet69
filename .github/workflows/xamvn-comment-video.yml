name: "2. Đăng Nhập & Comment Video Xamvn (Tùy Chỉnh Tần Suất)"

on:
  # Chạy định kỳ mỗi 1 tiếng 1 lần (đồng thời kết hợp cron-job.org gọi chính xác theo giờ)
  # - Vào các giờ gửi video (mặc định: 9h, 12h, 16h, 20h, 22h, 0h giờ VN): Gửi 1 video mới từ kho dự trữ Zpic
  # - Vào tất cả các giờ còn lại: Tự động comment "up lên" đẩy thớt
  schedule:
    - cron: '0 * * * *'

  workflow_dispatch:
    inputs:
      mode:
        description: "Chế độ chạy: 'auto' (tự phân theo giờ VN), 'video' (ép gửi video mới), 'bump' (ép comment up bài)"
        required: false
        type: string
        default: 'auto'
      video_hours:
        description: 'Các giờ VN (0-23) sẽ gửi video mới (mặc định: 9,12,16,20,22,0)'
        required: false
        type: string
        default: '9,12,16,20,22,0'
      max_posts_per_run:
        description: 'Số bình luận video cần đăng trong lần chạy này (mặc định: 1)'
        required: false
        type: string
        default: '1'
      thread_url:
        description: 'Link Thread Xamvn cần bình luận'
        required: false
        type: string
        default: 'https://xamvn.yachts/threads/311300/'

permissions:
  contents: write

concurrency:
  group: xamvn-comment-video
  cancel-in-progress: false

jobs:
  comment-xamvn:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install lightweight Python packages (Không cần FFmpeg)
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi beautifulsoup4 gspread google-auth requests

      - name: 💬 Đăng Nhập & Bình Luận Xamvn (Tự Động Theo Giờ)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          XAMVN_USERNAME: ${{ secrets.XAMVN_USERNAME || 'cudai2m' }}
          XAMVN_PASSWORD: ${{ secrets.XAMVN_PASSWORD || 'lehunghup' }}
          XAMVN_THREAD: ${{ github.event.inputs.thread_url || 'https://xamvn.yachts/threads/311300/' }}
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          VHOURS="${{ github.event.inputs.video_hours || '9,12,16,20,22,0' }}"
          MAX_POSTS="${{ github.event.inputs.max_posts_per_run || '1' }}"
          THREAD="${{ github.event.inputs.thread_url || 'https://xamvn.yachts/threads/311300/' }}"

          python -u scripts/post_zpic_to_xamvn.py \
            --mode "$MODE" \
            --video-hours "$VHOURS" \
            --max-posts-per-run "$MAX_POSTS" \
            --thread "$THREAD"

      - name: 💾 Commit & Push Lịch Sử Đăng Bài
        if: always()
        run: |
          git config --local user.email "gx288@users.noreply.github.com"
          git config --local user.name "gx288"
          git pull --rebase origin main || true
          git add data/xamvn_posted_monthly.json data/monthly_videos.json
          if git diff --staged --quiet; then
            echo "Không có bài đăng mới nào cần lưu."
          else
            git commit -m "Auto: comment to Xamvn $(date +'%Y-%m-%d %H:%M:%S') [skip ci]"
            git push origin main
          fi
