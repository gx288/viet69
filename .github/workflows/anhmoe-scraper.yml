name: Anhmoe Video Scraper

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      pages:
        description: 'Số trang muốn scrape (hoặc "all" để lấy hết)'
        required: false
        default: 'all'

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium gspread google-auth google-auth-oauthlib

      - name: Setup Chrome 144 & matching ChromeDriver
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 144
          install-chromedriver: true
          install-dependencies: true

      - name: Verify versions
        run: |
          google-chrome --version || google-chrome-stable --version
          chromedriver --version

      - name: Run scraper
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.pages }}" ] && [ "${{ github.event.inputs.pages }}" != "all" ]; then
            python -u anhmoe/scraper.py "${{ github.event.inputs.pages }}"
          else
            python -u anhmoe/scraper.py all
          fi

      - name: Commit and push videos_data.json (if changed)
        run: |
          # Pull trước để merge/rebase nếu branch có thay đổi từ action khác
          git pull --rebase origin ${{ github.ref_name }} || echo "Pull rebase thất bại, tiếp tục..."

          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          git add anhmoe/videos_data.json || true

          if git diff --staged --quiet; then
            echo "Không có thay đổi mới trong videos_data.json → bỏ qua commit"
          else
            git commit -m "Update videos_data.json - scraped $(date +'%Y-%m-%d %H:%M:%S UTC') [run ${{ github.run_id }}]"
            git push origin HEAD:${{ github.ref_name }}
            echo "Đã push file JSON thành công"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
