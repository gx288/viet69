name: Anhmoe Video Scraper

on:
  schedule:
    - cron: '0 */3 * * *'  # Chạy tự động mỗi 3 tiếng
  workflow_dispatch:
    inputs:
      pages:
        description: 'Số trang muốn scrape (hoặc "all" để lấy hết)'
        required: false
        default: 'all'

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Thêm quyền ghi để Bot có thể push file JSON lên lại repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium gspread google-auth google-auth-oauthlib oauth2client

      - name: Setup Chrome & matching ChromeDriver
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Run scraper
        env:
          # Truyền tất cả Secret vào biến môi trường
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ZPIC_COOKIES_BASE64: ${{ secrets.ZPIC_COOKIES_BASE64 }}
          ZPIC_USERNAME: ${{ secrets.ZPIC_USERNAME }}
          ZPIC_PASSWORD: ${{ secrets.ZPIC_PASSWORD }}
        run: |
          # Xử lý tham số đầu vào từ workflow_dispatch hoặc mặc định là 'all'
          INPUT_PAGES="${{ github.event.inputs.pages }}"
          if [ -z "$INPUT_PAGES" ]; then
            INPUT_PAGES="all"
          fi
          
          # Chạy script với đường dẫn chính xác
          python -u anhmoe/scraper.py "$INPUT_PAGES"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Cập nhật code mới nhất trước khi push để tránh xung đột
          git pull origin ${{ github.ref_name }} --rebase
          
          git add anhmoe/videos_data.json || true
          
          # Kiểm tra xem có thay đổi gì không trước khi commit
          if git diff --staged --quiet; then
            echo "Không có dữ liệu mới để cập nhật."
          else
            git commit -m "Auto-update video data: $(date +'%Y-%m-%d %H:%M')"
            git push origin HEAD:${{ github.ref_name }}
          fi
