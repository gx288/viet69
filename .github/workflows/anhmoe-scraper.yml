name: Anhmoe Video Scraper

on:
  schedule:
    - cron: '0 3 * * *'          # 3h sáng UTC mỗi ngày (~10h sáng VN)
  workflow_dispatch:
    inputs:
      pages:
        description: 'Số trang muốn scrape (hoặc "all" để lấy hết)'
        required: false
        default: 'all'

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium gspread google-auth google-auth-oauthlib

      - name: Setup Chrome 144 & matching ChromeDriver
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 144               # Force major version 144 → tự tải Chrome 144.x
          install-chromedriver: true        # Tự động cài ChromeDriver khớp version
          install-dependencies: true        # Cài libs cần cho headless

      - name: Verify versions (debug)
        run: |
          echo "Chrome version:"
          google-chrome --version || google-chrome-stable --version
          echo "ChromeDriver version:"
          chromedriver --version
          which chromedriver

      - name: Run scraper
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.pages }}" ] && [ "${{ github.event.inputs.pages }}" != "all" ]; then
            python anhmoe/scraper.py "${{ github.event.inputs.pages }}"
          else
            python anhmoe/scraper.py all
          fi
