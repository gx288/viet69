name: Anhmoe Video Scraper

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      pages:
        description: 'Số trang muốn scrape (hoặc "all" để lấy hết)'
        required: false
        default: 'all'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium gspread google-auth google-auth-oauthlib oauth2client

      - name: Setup Chrome & matching ChromeDriver
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Run scraper
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ZPIC_COOKIES_BASE64: ${{ secrets.ZPIC_COOKIES_BASE64 }}
          ZPIC_USERNAME: ${{ secrets.ZPIC_USERNAME }}
          ZPIC_PASSWORD: ${{ secrets.ZPIC_PASSWORD }}
          # Ép Python dùng đúng bản Chrome 146 vừa cài
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_BIN: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: |
          PAGES_INPUT="${{ github.event.inputs.pages }}"
          python -u anhmoe/scraper.py "${PAGES_INPUT:-all}"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin ${{ github.ref_name }} --rebase
          git add anhmoe/videos_data.json || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-update: $(date +'%Y-%m-%d %H:%M')"
            git push origin HEAD:${{ github.ref_name }}
          fi
