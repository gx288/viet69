name: Anhmoe Video Scraper

on:
  schedule:
    - cron: '0 */3 * * *'  # mỗi 3 tiếng
  workflow_dispatch:
    inputs:
      pages:
        description: 'Số trang muốn scrape (hoặc "all" để lấy hết)'
        required: false
        default: 'all'

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium gspread google-auth google-auth-oauthlib oauth2client

      - name: Clear previous Chrome/Driver cache (fix mismatch)
        run: |
          rm -f /usr/local/bin/chromedriver || true
          rm -rf /opt/hostedtoolcache/setup-chrome || true
          rm -rf /opt/google/chrome || true

      - name: Setup Chrome & matching ChromeDriver
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true
          install-dependencies: true

      - name: Verify Chrome & Driver versions (debug)
        run: |
          echo "Chrome version:"
          google-chrome --version || google-chrome-stable --version
          echo "ChromeDriver version:"
          chromedriver --version || true
          echo "Chrome binary path: $(which google-chrome || echo 'not found')"
          echo "ChromeDriver path: $(which chromedriver || echo 'not found')"

      - name: Run scraper
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ZPIC_COOKIES_BASE64: ${{ secrets.ZPIC_COOKIES_BASE64 }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.pages }}" ] && [ "${{ inputs.pages }}" != "all" ]; then
            python -u anhmoe/scraper.py "${{ inputs.pages }}"
          else
            python -u anhmoe/scraper.py all
          fi

      - name: Debug file status before commit
        run: |
          ls -la anhmoe/ || true
          git status --short || true
          [ -f anhmoe/videos_data.json ] && wc -l anhmoe/videos_data.json || echo "JSON not found"

      - name: Commit and push videos_data.json (if changed)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          git fetch origin
          git rebase origin/${{ github.ref_name }} || { git rebase --abort; git merge origin/${{ github.ref_name }} --no-edit || git reset --hard origin/${{ github.ref_name }}; }
          
          git add anhmoe/videos_data.json || true
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update videos_data.json - scraped $(date +'%Y-%m-%d %H:%M UTC') [${{ github.run_id }}]"
            git push origin HEAD:${{ github.ref_name }}
            echo "Pushed successfully"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
